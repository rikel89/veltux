<!-- VELTUX · Invitación (Supabase Auth → Email Templates → Invite user)
     Asunto: Te damos la bienvenida a VELTUX -->
<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f8fafc;font-family:Manrope,Segoe UI,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden">
            <tr>
              <td style="background:#121212;padding:24px 32px">
                <span style="font-size:22px;font-weight:800;letter-spacing:1px;color:#ffffff;font-style:italic">VELTU<span style="color:#b8ff65">X</span></span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px">
                <h1 style="margin:0 0 12px;font-size:22px">Tu espacio en VELTUX está listo</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#64748b">
                  Te han dado acceso a VELTUX, la agenda para barberías y peluquerías. Crea tu contraseña para empezar.
                </p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/cuenta/contrasena"
                   style="display:inline-block;background:#b8ff65;color:#121212;font-weight:700;font-size:15px;text-decoration:none;padding:14px 24px;border-radius:12px">
                  Crear mi contraseña
                </a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#94a3b8">
                  Si no esperabas este correo, ignóralo. El enlace caduca en 24 horas.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#94a3b8">Tu agenda. Tu negocio. Tu ritmo.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
